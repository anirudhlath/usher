name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads .python-version, without which the unbounded `requires-python`
      # resolves to the newest Python. An exact tag, because setup-uv's floating
      # majors stop at v7: `@v8` onward resolve to nothing and the job dies at
      # "Set up job", so do not "modernise" this to `@v10`.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # `--extra eval` is not bloat: tests/unit/test_eval_metrics_ir.py imports
      # ranx itself, so without the extra the file errors at collection, and
      # guarding ir.py's import would not help. No image installs the extra, and
      # pyproject.toml's import contracts keep usher.eval off every shipped path.
      - name: Install dependencies
        run: uv sync --frozen --extra eval

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      # tests/integration/ starts its own Postgres through testcontainers on the
      # Docker ubuntu-latest already runs, so there is no `services:` container.
      - name: Tests
        run: uv run pytest --cov=usher --cov-report=term-missing

  # Usher Console, a job of its own so a broken component and a broken migration
  # report separately. Ruff excludes web/, so nothing in `check` sees it: these
  # steps ARE its gate.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # An exact release tag, which needs no check that it resolves; a floating
      # major that does not exist fails the job at "Set up job".
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails if the
      # two disagree, which is what makes this job and the Dockerfile's
      # `console` stage build the same tree.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and component tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      # The production bundle must contain no mock server and no fixtures.
      # `main.tsx` guards that import with `import.meta.env.MODE === 'fixtures'`,
      # which Vite replaces with a literal so rollup drops the branch -- but
      # "tree-shaking probably handled it" is not evidence, and shipping a mock
      # network to a self-hosted product would be a genuinely bad outcome.
      - name: No fixtures in the production bundle
        run: |
          if grep -rlE 'mockServiceWorker|msw/browser|setupWorker' dist/assets/; then
            echo "::error::the production bundle carries the mock service worker"
            exit 1
          fi
          echo "production bundle is clean"

  # End-to-end and accessibility, in Playwright's image at the lockfile's exact
  # `@playwright/test` version: browser and system libraries are one pinned
  # artefact, and `npm run e2e:docker` reproduces this job. `e2e/stylesheet.spec.ts`
  # runs here and is load-bearing: it proves the design system reached the
  # browser, which every cheaper layer has passed without.
  console-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium's default /dev/shm inside a container is 64 MB and it crashes
      # on a large page rather than failing an assertion.
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # No `setup-node`: the image ships the Node the browser was built against,
      # and installing another one is how the two drift apart.
      - name: Install dependencies
        run: npm ci

      # Chromium only. The design is specified at three widths, not on three
      # engines, and the sweep is against axe rather than against a browser's
      # own behaviour -- so a second engine would triple the job for coverage
      # this design does not claim.
      - name: End-to-end and accessibility
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # The 120 screenshot comparisons. Baselines are portable across hosts, so a
  # failure everywhere is evidence about the code, not the runner.
  console-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # `--workers=1`, from the script: browsers racing one preview server for
      # webfonts can catch a screenshot mid-layout.
      - name: Visual regression
        run: npm run e2e:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # What neither job above proves: that the two build stages compose. A wrong
  # stage path or a `.dockerignore` gap is green in both and broken on
  # `docker compose up`. Nothing in CI starts the app or probes HTTP.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t usher:ci .

      # Proves the bundle is where `Settings.console_dist_dir` looks for it,
      # inside the image, without needing a database to start the app.
      - name: The console bundle is in the image
        run: |
          docker run --rm usher:ci sh -c '
            test -f /app/web/dist/index.html &&
            test -d /app/web/dist/assets &&
            echo "console bundle present"
          '
