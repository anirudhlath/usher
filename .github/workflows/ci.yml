name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads .python-version, without which the unbounded `requires-python`
      # resolves to the newest Python. An exact tag, because setup-uv's floating
      # majors stop at v7: `@v8` onward resolve to nothing and the job dies at
      # "Set up job", so do not "modernise" this to `@v10`.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # `--extra eval` is not bloat: tests/unit/test_eval_metrics_ir.py imports
      # ranx itself, so without the extra the file errors at collection, and
      # guarding ir.py's import would not help. No image installs the extra, and
      # pyproject.toml's import contracts keep usher.eval off every shipped path.
      - name: Install dependencies
        run: uv sync --frozen --extra eval

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Architecture contracts
        run: uv run lint-imports

      # tests/integration/ starts its own Postgres through testcontainers on the
      # Docker ubuntu-latest already runs, so there is no `services:` container.
      - name: Tests
        run: uv run pytest --cov=usher --cov-report=term-missing

  # Usher Console, a job of its own so a broken component and a broken migration
  # report separately. Ruff excludes web/, so nothing in `check` sees it: these
  # steps ARE its gate.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # An exact release tag, which needs no check that it resolves; a floating
      # major that does not exist fails the job at "Set up job".
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci`, not `install`: it installs exactly the lockfile and fails if the
      # two disagree, which is what makes this job and the Dockerfile's
      # `console` stage build the same tree.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit and component tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

      # The production bundle must contain no mock server and no fixtures.
      # `main.tsx` guards that import with `import.meta.env.MODE === 'fixtures'`,
      # which Vite replaces with a literal so rollup drops the branch -- but
      # "tree-shaking probably handled it" is not evidence, and shipping a mock
      # network to a self-hosted product would be a genuinely bad outcome.
      - name: No fixtures in the production bundle
        run: |
          if grep -rlE 'mockServiceWorker|msw/browser|setupWorker' dist/assets/; then
            echo "::error::the production bundle carries the mock service worker"
            exit 1
          fi
          echo "production bundle is clean"

  # End-to-end and accessibility, in Playwright's image at the lockfile's exact
  # `@playwright/test` version: browser and system libraries are one pinned
  # artefact, and `npm run e2e:docker` reproduces this job. `e2e/stylesheet.spec.ts`
  # runs here and is load-bearing: it proves the design system reached the
  # browser, which every cheaper layer has passed without.
  console-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium's default /dev/shm inside a container is 64 MB and it crashes
      # on a large page rather than failing an assertion.
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # No `setup-node`: the image ships the Node the browser was built against,
      # and installing another one is how the two drift apart.
      - name: Install dependencies
        run: npm ci

      # Chromium only. The design is specified at three widths, not on three
      # engines, and the sweep is against axe rather than against a browser's
      # own behaviour -- so a second engine would triple the job for coverage
      # this design does not claim.
      - name: End-to-end and accessibility
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # The 120 screenshot comparisons. Baselines are portable across hosts, so a
  # failure everywhere is evidence about the code, not the runner.
  console-visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      # `--workers=1`, from the script: browsers racing one preview server for
      # webfonts can catch a screenshot mid-layout.
      - name: Visual regression
        run: npm run e2e:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # What neither job above proves: that the two build stages compose. A wrong
  # stage path or a `.dockerignore` gap is green in both and broken on
  # `docker compose up`. Nothing in CI starts the app or probes HTTP.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t usher:ci .

      # Proves the bundle is where `Settings.console_dist_dir` looks for it,
      # inside the image, without needing a database to start the app.
      - name: The console bundle is in the image
        run: |
          docker run --rm usher:ci sh -c '
            test -f /app/web/dist/index.html &&
            test -d /app/web/dist/assets &&
            echo "console bundle present"
          '

  # Job id `gate`, display name `ci-ok`: `needs.ci-ok` would parse as a
  # subtraction. Generic on purpose -- it reads whatever is in `needs`, so a job
  # added above is covered the moment it is listed there.
  gate:
    name: ci-ok
    # Runs even when something upstream failed; a skipped gate is what `deploy`
    # checks for.
    if: always()
    needs: [check, console, console-e2e, console-visual, image]
    runs-on: ubuntu-latest
    steps:
      - name: every upstream job passed
        run: |
          cat <<'JSON' > needs.json
          ${{ toJSON(needs) }}
          JSON
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' needs.json
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | .key' needs.json)
          if [ -n "$bad" ]; then
            echo "::error::not green: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  # The maintainer's own deployment: a merge to main rebuilds the live stack on
  # a self-hosted runner. Only this job reaches that runner, and only for a push
  # to main that passed every job above. `github.repository` keeps a fork's
  # push from queueing a job no runner of its own will ever take.
  #
  # The stack is compose project `usher-prod`, run from an operator directory,
  # `~/code/usher-deploy`, which holds `.env` and `data/`. This job copies the
  # two compose files there and writes nothing else.
  deploy:
    name: deploy to the box
    needs: [gate]
    # `always() &&` is load-bearing: without it the job inherits the implicit
    # success() check, and a skipped job upstream skips the deploy even when
    # `gate` succeeded.
    if: >-
      ${{ always()
      && needs.gate.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'anirudhlath/usher' }}
    runs-on: [self-hosted, linux, usher-deploy]
    timeout-minutes: 60
    # Two deploys at once would race between building an image and replacing
    # the container. Queue, never cancel.
    concurrency:
      group: deploy-usher
      cancel-in-progress: false
    env:
      # What compose names the `usher` service's image and container under the
      # project name the deploy directory's `.env` pins.
      IMAGE: usher-prod-usher
      CONTAINER: usher-prod-usher-1
    steps:
      - uses: actions/checkout@v7

      - name: Preflight
        run: |
          deploy_dir="$HOME/code/usher-deploy"
          if [ ! -f "$deploy_dir/.env" ]; then
            echo "::error::$deploy_dir/.env is missing; the deploy directory is operator state"
            exit 1
          fi
          echo "DEPLOY_DIR=$deploy_dir" >> "$GITHUB_ENV"

      - name: Record the running image for rollback
        id: rollback
        run: |
          if id=$(docker inspect -f '{{.Image}}' "$CONTAINER" 2>/dev/null); then
            docker tag "$id" "$IMAGE:rollback"
            echo "image=$id" >> "$GITHUB_OUTPUT"
            echo "rollback target: $id"
          else
            echo "image=none" >> "$GITHUB_OUTPUT"
            echo "::notice::no running $CONTAINER; first deploy, nothing to roll back to"
          fi

      # Tagged by sha only. `latest` moves in Start, so a build that is never
      # started cannot be picked up by a later `docker compose up`.
      - name: Build
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # A rollback cannot undo a migration: the previous image refuses a schema
      # newer than its own chain. So every deploy first writes a backup with the
      # running image, and the last ten are kept.
      - name: Back up
        if: steps.rollback.outputs.image != 'none'
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          mkdir -p data/bulk/predeploy
          docker compose exec -T usher usher backup \
            --output "/data/bulk/predeploy/${{ github.sha }}.jsonl.gz"
          find data/bulk/predeploy -name '*.jsonl.gz' -printf '%T@ %p\n' \
            | sort -rn | tail -n +11 | cut -d' ' -f2- | xargs -r -d '\n' rm --

      - name: Publish the compose files to the deploy directory
        run: cp compose.yml compose.observability.yml "$DEPLOY_DIR/"

      # The marker is written before anything is touched, so the rollback fires
      # for a failure part-way through. The migration runs on its own, with the
      # app stopped, so a long one is not mistaken for an unhealthy container;
      # `--wait` then verifies the start against the healthcheck
      # (`/health/ready`, which also compares the migration state).
      #
      # `--force-recreate` is load-bearing: the service has `build:` and no
      # `image:`, so under `--no-build` compose never compares the retagged
      # `latest` with the container's image, and a plain `up` restarts the old
      # container, healthy. The last line is what catches that: a start is only
      # a deploy if the running container is the image this job built.
      - name: Start
        id: start
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          echo "started=1" >> "$GITHUB_OUTPUT"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker compose up -d --no-build --wait postgres
          docker compose stop usher
          docker compose run --rm --no-deps -T usher alembic upgrade head
          docker compose up -d --no-build --force-recreate --wait --wait-timeout 180 usher
          built=$(docker image inspect -f '{{.Id}}' "$IMAGE:${{ github.sha }}")
          running=$(docker inspect -f '{{.Image}}' "$CONTAINER")
          echo "built:   $built"
          echo "running: $running"
          if [ "$running" != "$built" ]; then
            echo "::error::$CONTAINER is running $running, not the image this job built"
            exit 1
          fi

      # `always()`, not `failure()`: a cancel or a timeout mid-start must roll
      # back too. `set +e` so the log and the verdict print even if a command
      # in the rollback fails.
      - name: Roll back
        if: always() && steps.start.outputs.started == '1' && steps.start.outcome != 'success'
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          TARGET: ${{ steps.rollback.outputs.image }}
        run: |
          set +e
          echo "::group::usher log"
          docker compose logs --tail 150 usher
          echo "::endgroup::"
          if [ "$TARGET" = "none" ]; then
            echo "::error::deploy failed and there is no previous image to restore"
            exit 1
          fi
          echo "::warning::deploy failed; restoring $TARGET"
          docker tag "$TARGET" "$IMAGE:latest"
          if docker compose up -d --no-build --force-recreate --wait --wait-timeout 180 usher; then
            echo "::error::deploy failed; rolled back to $TARGET and it is healthy"
          else
            echo "::error::deploy failed AND the rollback is not healthy. If this deploy migrated the schema, the previous image cannot run on it: fix forward, with the backup in data/bulk/predeploy/"
          fi
          exit 1

      # Keeps the last five sha tags. `latest` and `rollback` never match the
      # 40-hex pattern, and removing a tag that backs a running container
      # removes only the tag.
      - name: Prune old deploy images
        if: always()
        run: |
          stale=$(docker images "$IMAGE" --format '{{.CreatedAt}}|{{.Tag}}' \
            | grep -E '\|[0-9a-f]{40}$' \
            | sort -r \
            | tail -n +6 \
            | cut -d'|' -f2)
          if [ -n "$stale" ]; then
            echo "$stale" | xargs -I{} docker rmi "$IMAGE:{}"
          fi
