name: Release

# Its own file: `ci.yml` runs on pushes to main, so a `tags:` trigger there would
# run the suite on the tag and again on the merge before it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  # `attest-build-provenance` needs both, and neither is granted by default.
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # Each floating major below was checked to exist with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`: one that does not fails at
      # "Set up job" before any step runs. setup-uv's floating majors stop at v7,
      # which is why ci.yml pins `@v9.0.0` exactly; do not "modernise" it to `@v10`.
      # This workflow needs no setup-uv: `uv` runs inside `docker build`.
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR, because `GITHUB_TOKEN` already authenticates here with
          # `packages: write` and there is no secret to manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Multi-arch is declined: with no arm64 machine to test on, a QEMU build
          # would publish an image nobody has ever started. Nothing in the
          # Dockerfile blocks it, and the reversal is two lines: add
          # `docker/setup-qemu-action@v4` above and a `platforms:` key here.

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
