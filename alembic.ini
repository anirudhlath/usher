[alembic]
# Relative to this file rather than the working directory.
script_location = %(here)s/src/usher/db/migrations

prepend_sys_path = .

# Without this key, alembic falls back to its legacy splitting of
# version_locations and prepend_sys_path.
path_separator = os

# No sqlalchemy.url: env.py reads USHER_DATABASE_URL through Usher's Settings and
# never this file, so a DSN here would be an unread second copy of a credential.


[post_write_hooks]

# Read only by env.py's `fileConfig`, which leaves loggers not named here enabled.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
