[project]
name = "usher"
version = "0.1.0"
description = "A self-hosted media catalog backend that abstracts media servers behind a canonical database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "uuid6>=2024.7.10",
    "loguru>=0.7",
    "httpx[http2]>=0.27",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
packages = ["usher"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uuid6", "testcontainers.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["usher"]

# An allowlist, not a denylist: every top-level package's place is defined by
# where it sits (or that it's named at all), so a new package can't silently
# escape every contract the way usher.config and usher.api once did under
# three hand-maintained forbidden_modules lists.

[[tool.importlinter.contracts]]
name = "hexagonal layering"
type = "layers"
layers = ["usher.api", "usher.services", "usher.ports", "usher.domain"]

[[tool.importlinter.contracts]]
name = "adapters are driven, not driving"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports", "usher.services"]
forbidden_modules = ["usher.adapters"]

[[tool.importlinter.contracts]]
name = "db is driven, not driving"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports", "usher.services"]
forbidden_modules = ["usher.db"]

[[tool.importlinter.contracts]]
name = "config stays out of the core"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports"]
forbidden_modules = ["usher.config"]
