# **The tenth contract, and the invariant it holds is the only one in this
# project that no top-level contract can see.** The nine above are stated at
# `usher.api`, `usher.services`, `usher.ports`, `usher.domain`, `usher.adapters`,
# `usher.db`, `usher.config` and `usher.cli` -- top-level packages -- so an
# import between two *submodules* of `usher.ports.repository` is invisible to
# every one of them. Measured by A1's own sweep: inverting `_results.py` into
# `bulk.py` and importing it back the other way passes `ruff check`,
# `ruff format --check`, `mypy` and all nine contracts, and is caught only by
# `tests/unit/test_ports_repository_package.py::test_no_aggregate_module_imports_
# another_aggregate_module`, one bespoke AST scan in one file.
#
# `testing-discipline.md`'s own rule from M8 Task 17 is what settles it --
# *prefer a graph property wherever one is expressible* -- and here one is:
# `independence` forbids an import in **either** direction between any pair of
# the listed modules, including indirect chains, which a `forbidden` contract
# cannot express without twenty source/forbidden pairs. The two checks do not
# subsume each other and both are kept: the AST scan sees a module the list has
# forgotten, and the contract sees an indirect chain the scan's single-hop
# `ImportFrom` walk does not.
#
# **The list is the contract, exactly as the one above says of its own**, so
# `test_the_independence_contract_names_every_aggregate_port_module` derives the
# expected membership from the package and fails if a new port module lands
# unlisted. `usher.ports.repository._results` is deliberately absent: it is the
# shared private module every aggregate is allowed to import, and listing it
# would forbid the thing this design is for.
[[tool.importlinter.contracts]]
name = "no aggregate port module imports another"
type = "independence"
modules = [
    "usher.ports.repository.bulk",
    "usher.ports.repository.collection",
    "usher.ports.repository.curation",
    "usher.ports.repository.episode",
    "usher.ports.repository.genome",
    "usher.ports.repository.image",
    "usher.ports.repository.import_run",
    "usher.ports.repository.llm_call",
    "usher.ports.repository.matching",
    "usher.ports.repository.media_item",
    "usher.ports.repository.people",
    "usher.ports.repository.row_provider_settings",
    "usher.ports.repository.search",
    "usher.ports.repository.search_query",
    "usher.ports.repository.source",
    "usher.ports.repository.sync",
    "usher.ports.repository.taste",
    "usher.ports.repository.title",
    "usher.ports.repository.watch_state",
]

# **The eleventh contract.** `usher.eval` may import anything -- it drives the
# real services through the real composition root, which is the whole design --
# and **nothing may import it**. Without this it would sit outside all ten
# contracts above, which is precisely the "a new package can't silently escape
# every contract" failure the allowlist note at the top of this section names,
# and it would let a shipped code path pick up a dev-only extra.
#
# **`source_modules` is every top-level importable name under `src/usher/`
# except one, and `usher.cli` is that one.** It is exempt deliberately --
# `usher eval` is a subcommand, so the CLI is this package's composition root,
# the same exemption `usher.composition` holds in three contracts above -- and
# it is safe for the same reason: the contract "cli is a composition root,
# nothing depends on it" already stops anything reaching `usher.eval` back
# through `usher.cli`. Exempt is the claim; absent is not, and this comment
# said "the only absence" until 2026-08-18 while a second name was missing.
#
# **That exemption did not work, and it failed for the one case it exists
# for.** Measured 2026-08-19 with the future state planted -- a *used*,
# ruff-clean `from usher.eval.metrics import ir` in `usher/cli.py`, in its
# isort position, which is what the `usher eval` subcommand will be -- this
# contract reported **11 kept, 1 broken**:
#
#     the eval harness is a leaf, nothing depends on it BROKEN
#     usher.__main__ is not allowed to import usher.eval:
#     -   usher.__main__ -> usher.cli (l.16)
#         usher.cli -> usher.eval.metrics.ir (l.59)
#
# A `forbidden` contract reports **indirect chains by default**, and
# `usher.__main__` is a source that imports `usher.cli` -- which is the
# container entrypoint's entire job. So the exemption held only while nothing
# in `usher.cli` reached `usher.eval`, i.e. only before the subcommand it was
# written for. `allow_indirect_imports = true` is the repair, the same flag
# the sixth, seventh, eighth and twelfth contracts carry; with it and the same
# plant, **12 kept, 0 broken**.
#
# **It is a real narrowing and not only a repair, which is the difference from
# those four.** A module that reaches `usher.eval` *through* `usher.cli` is no
# longer reported here. What still reports it is the fifth contract, which has
# no such flag: planting a used `from usher.cli import main` in
# `usher/telemetry.py` on top of the `cli.py` plant leaves this contract KEPT
# and turns **four others** red (`8 kept, 4 broken`) -- *cli is a composition
# root* on `usher.services.images -> usher.telemetry -> usher.cli`, plus both
# layering contracts and *hexagonal layering* on the same chain. Every source
# listed below except one is imported by something in that contract's six, so
# the loop is closed for all of them. **The exception is `usher.__main__`,
# which nothing imports** -- and that is precisely the intended path, since it
# exists to run the CLI.
#
# **That last paragraph is a graph fact, and as of 2026-08-19 a test holds it
# rather than this comment.** Measured direct importers inside the fifth
# contract's six: `usher.config` 3, `usher.composition` 3 (all six of those in
# `usher.api`), `usher.telemetry` 12, `usher.__main__` **0**. Nothing checked
# it, while `test_eval_contract.py` already pinned the flag, the forbidden
# module, the `usher.cli` exemption and the full source list -- so a refactor
# unhooking one of the three would have opened a real hole with the gate still
# green. Verified by planting exactly that (the three `from usher.composition
# import` statements in `usher/api/` rewritten away, out of tree): the gate
# reported **12 kept, 0 broken** with `usher.composition` silently exempt from
# both contracts, and `test_the_eval_package_is_named_by_an_import_contract`
# failed on its own line naming it. Restored, green.
#
# **Every *direct* import of `usher.eval` is still caught in every listed
# source, with the flag on**, which is the claim this contract is really
# making. Re-measured with the careful spelling, one plant at a time:
# `from usher.eval import goldens` used in `src/usher/__main__.py` reports
# `usher.__main__ -> usher.eval.goldens (l.17)`, and the same import in
# `src/usher/services/search.py` reports
# `usher.services.search -> usher.eval.goldens (l.75)` -- **11 kept, 1 broken**
# each.
#
# The flag's presence is asserted by `tests/unit/test_eval_contract.py`, and
# the reason is a trap rather than symmetry with the twelfth: deleting it
# turns this contract red the day Task 11 lands, and the obvious repair for
# that red is to delete `usher.__main__` from the list below -- which unpicks
# the measured fix recorded in the next paragraph, and which the same test
# then fails on, sending the reader further wrong.
#
# That name was `usher.__main__`, the container entrypoint
# (`CMD alembic upgrade head && exec python -m usher`), and it was the one
# genuinely open surface. Measured, not reasoned: a *used*, ruff-clean
# `from usher.eval import goldens` planted in `src/usher/__main__.py` reported
# **11 kept, 0 broken**. It is listed now and must stay listed. The same plant
# in `src/usher/__init__.py` is caught even unlisted, because `usher` is
# reached from `usher.composition` through the adapters -- `__main__` is
# reached from nothing, which is exactly what made it invisible.
#
# `tests/unit/test_eval_contract.py` derives this list from a `pkgutil` walk of
# `src/usher/` and asserts set equality, so the next top-level package to land
# fails there by name rather than sitting outside a contract that still reports
# 11 kept.
#
# Verified in both directions, with the careful spelling. A plant that dies on
# ruff `F401` proves only that ruff works, so the plant is *used*:
#     `from usher.eval import goldens` in `usher/__main__.py`, in its isort
#     position, with `_PLANT = goldens.__name__` beside it.
# With the module listed: **10 kept, 1 broken**, naming
# `usher.__main__ -> usher.eval.goldens (l.17)`. Reverted from a `cp` backup
# and re-verified at 11 kept, 0 broken -- never with `git checkout <path>`,
# which discards uncommitted work along with the plant.
[[tool.importlinter.contracts]]
name = "the eval harness is a leaf, nothing depends on it"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.adapters",
    "usher.db",
    "usher.api",
    "usher.config",
    "usher.composition",
    "usher.telemetry",
    "usher.__main__",
]
forbidden_modules = ["usher.eval"]
allow_indirect_imports = true

# **The twelfth contract, which turns `metrics/__init__.py`'s sentence into a
# check.** That docstring says `ir.py` is the only module in this project that
# imports `ranx`, and the mypy override above claimed the *eleventh* contract
# was what made that true rather than conventional. It was not, and the
# correction is measured rather than argued (2026-08-19): `ranx` was not a node
# in the graph at all -- `root_packages = ["usher"]` with no
# `include_external_packages`, so `'ranx' in graph.modules` is `False` -- and
# the eleventh contract's `forbidden_modules` is `["usher.eval"]`, a statement
# about who may reach the *harness*, not about who may reach the *library*.
# A **used**, ruff-clean `import ranx` planted in its isort position with a
# `_PLANT = ranx.__name__` beside it, in **both** `usher/adapters/http.py` and
# `usher/eval/errors.py` at once, reported **11 kept, 0 broken**; the positive
# control on the same out-of-tree copy (`from usher.eval import errors` in
# `usher/__main__.py`) reported **10 kept, 1 broken**, which is what proves the
# probe was reading that copy rather than something else.
#
# The confinement is not housekeeping. It is the whole mitigation for the risk
# `metrics/__init__.py` records: `numba`/`llvmlite` pin an LLVM ABI and have
# historically lagged new CPython, so a 3.14 move could block the `eval` extra,
# and the escape -- swapping to `ir_measures`, 4 packages and no numba -- is
# only "one file" for as long as it is genuinely one file. An unenforced
# boundary is one import away from not existing.
#
# **What `include_external_packages` costs**, measured on this host rather than
# guessed, because a wider graph is a real trade and belongs in the open. The
# graph goes from *228 files, 906 dependencies* to *279 files, 1,741
# dependencies*. Ten interleaved A/B pairs of `uv run lint-imports`, medians:
# **206 ms -> 219 ms** warm, **250 ms -> 269 ms** with `.import_linter_cache`
# removed before each run. That is +13 ms and +19 ms, i.e. not material, and it
# is stated here so nobody re-derives it.
#
# **`allow_indirect_imports` is load-bearing and is not a loosening**, the same
# call the sixth, seventh and eighth contracts make and for the same reason.
# The claim being enforced is *nothing outside `usher.eval.metrics` may **name**
# `ranx`*; reaching `score()` through the module that does name it is the design,
# not a violation. Measured with the future state planted -- a ruff-clean
# `from usher.eval.metrics import ir` in `usher/cli.py`, which is what the
# `usher eval` subcommand will be: **without** the flag this contract is BROKEN
# on `usher.cli -> usher.eval.metrics.ir -> ranx`, the reverse of what it is
# for; **with** it, KEPT, while a direct `import ranx` anywhere in the source
# list is still BROKEN. Nothing else can reach `ranx` indirectly either, because
# the only usher module that imports it is inside `usher.eval.metrics` and the
# eleventh contract governs who may reach `usher.eval` at all.
#
# **The exemption is the package `usher.eval.metrics`, not the module `ir`**,
# and that is a limit of the contract type rather than a choice: a `forbidden`
# contract's `source_modules` cover a module *and all its descendants*, so
# `usher.eval.metrics` cannot be a source with `ir` carved out of it. A second
# `metrics` module importing `ranx` would therefore be KEPT here. That last
# inch is held by a scan --
# `test_eval_contract.py::test_only_the_ir_module_inside_the_metrics_package_names_ranx`
# -- for the reason M8 Task 17 recorded: a graph property covers every module
# rather than the one a scan is pointed at, and a scan sees what a list has
# forgotten, so neither check subsumes the other and both are kept.
#
# **The list is the contract**, exactly as the eleventh and tenth say of their
# own, so `test_eval_contract.py::test_the_ranx_contract_names_every_module_that_
# may_not_import_it` derives it from two `pkgutil` walks -- top level minus
# `usher.eval`, plus `usher.eval`'s children minus `metrics` -- and carries a
# premise guard, because a walk that globs nothing passes exactly like a walk
# that passes. `usher.cli` is a source here and is *not* exempt as it is in the
# eleventh: it is the eval harness's composition root, which is a reason to let
# it import `usher.eval`, and no reason at all to let it import `ranx`.
#
# Two more measurements a future reader will want and should not have to take.
# **The contract does not need the extra installed**: grimp reads the name out
# of the source, so a venv synced without `--extra eval` (where `import ranx`
# fails at runtime) still reports 12 kept, 0 broken. And **it goes vacuous
# rather than loud** the day the swap happens: with `ir.py` no longer importing
# `ranx`, `ranx` leaves the graph and this contract reports KEPT with nothing
# to check, so whoever moves to `ir_measures` has to re-point it here rather
# than being told to by a red gate.
#
# Verified in both directions with the careful spelling, out of tree, restored
# from `cp` backups and read back -- never `git checkout <path>`. Both plants
# together: **11 kept, 1 broken**, naming
# `usher.adapters.http -> ranx (l.29)` and `usher.eval.errors -> ranx (l.8)`.
# Restored: **12 kept, 0 broken**.
[[tool.importlinter.contracts]]
name = "only the IR metrics package imports ranx"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.adapters",
    "usher.db",
    "usher.api",
    "usher.config",
    "usher.composition",
    "usher.telemetry",
    "usher.cli",
    "usher.__main__",
    "usher.eval.bars",
    "usher.eval.errors",
    "usher.eval.fingerprint",
    "usher.eval.goldens",
    "usher.eval.ledger",
    "usher.eval.runner",
    "usher.eval.suggest_run",
    "usher.eval.surfaces",
    "usher.eval.verdicts",
]
forbidden_modules = ["ranx"]
allow_indirect_imports = true
