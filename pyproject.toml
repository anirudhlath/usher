[project]
name = "usher"
version = "0.1.0"
description = "A self-hosted media catalog backend that abstracts media servers behind a canonical database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "uuid6>=2024.7.10",
    "loguru>=0.7",
    "httpx[http2]>=0.27",
    # Already a transitive of `uvicorn[standard]`, declared because a transitive is
    # not a contract. Imported lazily, so a deployment with no push lane never loads it.
    "websockets>=15",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "cryptography>=49.0.0",
]

[project.optional-dependencies]
# The semantic tier's runtime, an extra because full-text and trigram serve every
# title without a model: a deployment without it is narrowed, not broken. Declared
# although the import is lazy, so it can be installed on purpose. No image installs
# an extra.
embedding = ["fastembed>=0.8"]

# An extra for `embedding`'s reason, at about three times its size. CI syncs it
# anyway: `tests/unit/test_eval_metrics_ir.py` imports `ranx` and errors at
# collection without it. `ranx` stays confined to `usher/eval/metrics/ir.py`, so
# `ir_measures` remains a one-file swap if numba ever blocks a CPython upgrade.
eval = ["ranx>=0.3.21"]

[project.scripts]
# The same code path as `python -m usher`, the form the container's CMD uses.
usher = "usher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    # Already import-linter's transitive, declared because
    # `tests/unit/test_eval_contract.py` imports it directly: a repackaged
    # import-linter would otherwise turn that test into a collection error.
    "grimp>=3.15",
    "testcontainers[postgres]>=4.9",
    "asgi-lifespan>=2.1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` ships every file in the package, `.py` or not, so
# `usher/eval/schema.sql` needs no `force-include`.
# `test_the_schema_sql_ships_beside_the_module` holds that.
packages = ["src/usher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# `integration` is applied by tests/integration/conftest.py, not by hand. It is
# deliberately not excluded in addopts: an addopts `-m` applies even to an
# explicit path, so `pytest tests/integration/...` would collect zero tests.
markers = [
    "integration: needs a live PostgreSQL via Docker (testcontainers); see tests/integration/conftest.py",
    # Args are table names. `session`'s teardown asserts `pg_class` still describes
    # the database, because one test's statistics are every later test's planner.
    # `restored_by="<fixture>"` means the leak must survive until that fixture runs;
    # see `restores_the_statistics_this_seed_leaks`.
    "leaks_statistics: this test leaves pg_class describing rows it rolled back",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Ruff formats Python fences inside Markdown, so `docs`, `.claude` and
# `dashboards/README.md` are excluded to keep quoted code as written, and `web` so
# ruff never walks `web/node_modules/`. An explicit path argument bypasses all of
# it. `dashboards/README.md` is a path, not the directory, so a `.py` landing under
# `dashboards/` is still linted.
extend-exclude = ["docs", ".claude", "web", "dashboards/README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest asserts. S105-S107: fixtures name literal credentials, and
# a `# noqa` on each would get copied into `src/`, where these rules still matter.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Packages with no type information. `yaml` and `asyncpg.*` are test-only, where a
# stub package is more surface than the `Any` it removes. `ranx` needs this rather
# than a per-line ignore: installed it is `import-untyped`, absent it is
# `import-not-found`, and no code-scoped ignore is green in both environments.
module = ["uuid6", "testcontainers.*", "yaml", "fastembed", "ranx", "asyncpg.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["usher"]
# Makes `ranx` a node in the graph, so the last contract can name it. Top-level,
# so every contract is checked against the wider graph.
include_external_packages = true

# An allowlist, not a denylist: every top-level package's place is defined by
# where it sits (or that it's named at all), so a new package can't silently
# escape every contract.

[[tool.importlinter.contracts]]
name = "hexagonal layering"
type = "layers"
layers = ["usher.api", "usher.services", "usher.ports", "usher.domain"]

[[tool.importlinter.contracts]]
name = "adapters are driven, not driving"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports", "usher.services"]
forbidden_modules = ["usher.adapters"]

[[tool.importlinter.contracts]]
name = "db is driven, not driving"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports", "usher.services"]
forbidden_modules = ["usher.db"]

[[tool.importlinter.contracts]]
name = "config stays out of the core"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports"]
forbidden_modules = ["usher.config"]

# usher.cli is the second composition root, alongside usher.api. It may import
# anything; nothing may import it.
[[tool.importlinter.contracts]]
name = "cli is a composition root, nothing depends on it"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.adapters",
    "usher.db",
    "usher.api",
]
forbidden_modules = ["usher.cli"]

# Nothing outside the registry may *name* a concrete source adapter.
# `allow_indirect_imports` is not a loosening: `usher.api.deps -> adapters.factory
# -> adapters.emby` is the chain the factory exists for, and a direct import is
# still BROKEN. `usher.cli` (a composition root) and `usher.adapters` (the registry)
# are exempt, and a new top-level package is outside this until it is listed.
[[tool.importlinter.contracts]]
name = "no concrete source adapter escapes its package"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.api",
    "usher.db",
]
forbidden_modules = ["usher.adapters.emby"]
allow_indirect_imports = true

# The same rule for the implementations most likely to be swapped. The flag for the
# previous contract's reason: the roots reach these through `usher.composition`.
# That module is absent from every source list; a core module reaching it still
# breaks contracts two and three, which report indirect chains.
[[tool.importlinter.contracts]]
name = "no concrete search, embedding or LLM implementation escapes its package"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.api",
    "usher.db",
]
forbidden_modules = [
    "usher.adapters.search",
    "usher.adapters.embedding",
    "usher.adapters.llm",
]
allow_indirect_imports = true

# Generation happens in a background job, never in the request path, as a graph
# property: a name scan missed `composition.build_curation_service`, which returns
# a `CurationService` under none of the scanned names. The flag because every router
# reaches `usher.composition` through `usher.api.deps`: a router may reach a service
# through a dependency, never *name* the wiring.
[[tool.importlinter.contracts]]
name = "no router names the wiring, the curation service or the LLM port"
type = "forbidden"
source_modules = ["usher.api.routers"]
forbidden_modules = [
    "usher.composition",
    "usher.services.curation",
    "usher.ports.llm",
]
allow_indirect_imports = true

# `adapters/http.py` is the error-taxonomy translation every adapter imports, so an
# edge back into an adapter is a cycle that resolves quietly. No
# `allow_indirect_imports`: it imports only httpx and the standard library, so an
# indirect chain into an adapter is as much a cycle as a direct one.
[[tool.importlinter.contracts]]
name = "the shared http helpers import no concrete adapter"
type = "forbidden"
source_modules = ["usher.adapters.http"]
# Every adapter package must be listed: a `forbidden` contract covers only what it
# names, so an omitted package is silently unconstrained.
forbidden_modules = [
    "usher.adapters.bulk",
    "usher.adapters.embedding",
    "usher.adapters.emby",
    "usher.adapters.images",
    "usher.adapters.llm",
    "usher.adapters.search",
    "usher.adapters.tmdb",
]

# An import between two submodules of `usher.ports.repository` is invisible to every
# top-level contract. `independence` forbids either direction between any pair,
# indirect chains included. `_results` is absent: every aggregate may import it.
# `test_the_independence_contract_names_every_aggregate_port_module` keeps the list
# complete.
[[tool.importlinter.contracts]]
name = "no aggregate port module imports another"
type = "independence"
modules = [
    "usher.ports.repository.backup",
    "usher.ports.repository.bulk",
    "usher.ports.repository.collection",
    "usher.ports.repository.curation",
    "usher.ports.repository.episode",
    "usher.ports.repository.genome",
    "usher.ports.repository.image",
    "usher.ports.repository.import_run",
    "usher.ports.repository.llm_call",
    "usher.ports.repository.matching",
    "usher.ports.repository.media_item",
    "usher.ports.repository.people",
    "usher.ports.repository.row_provider_settings",
    "usher.ports.repository.search",
    "usher.ports.repository.search_query",
    "usher.ports.repository.source",
    "usher.ports.repository.sync",
    "usher.ports.repository.taste",
    "usher.ports.repository.title",
    "usher.ports.repository.watch_state",
]

# Nothing may import `usher.eval`, so no shipped path reaches a dev-only extra;
# `usher.cli` is exempt as the harness's composition root. Keep both the flag and
# `usher.__main__`: without the flag `__main__ -> cli -> eval` breaks this, and
# dropping `__main__` to silence that leaves a direct import there unseen.
# `tests/unit/test_eval_contract.py` derives this list and pins the flag.
[[tool.importlinter.contracts]]
name = "the eval harness is a leaf, nothing depends on it"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.adapters",
    "usher.db",
    "usher.api",
    "usher.atomic",
    "usher.config",
    "usher.composition",
    "usher.telemetry",
    "usher.__main__",
]
forbidden_modules = ["usher.eval"]
allow_indirect_imports = true

# Only `usher.eval.metrics` may name `ranx`, keeping an `ir_measures` swap to one
# file; the flag lets callers reach it through `ir.py`. A contract cannot carve `ir`
# out of its package, so `test_eval_contract.py` pins `ranx` to that module and
# derives this list. `usher.cli` is a source here, unlike above. If `ir.py` stops
# importing `ranx`, this goes vacuous rather than red: re-point it.
[[tool.importlinter.contracts]]
name = "only the IR metrics package imports ranx"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.adapters",
    "usher.db",
    "usher.api",
    "usher.atomic",
    "usher.config",
    "usher.composition",
    "usher.telemetry",
    "usher.cli",
    "usher.__main__",
    "usher.eval.bars",
    "usher.eval.errors",
    "usher.eval.fingerprint",
    "usher.eval.goldens",
    "usher.eval.ledger",
    "usher.eval.runner",
    "usher.eval.suggest_run",
    "usher.eval.surfaces",
    "usher.eval.verdicts",
]
forbidden_modules = ["ranx"]
allow_indirect_imports = true

# The configuration reads nothing above the domain: a check needing a number a service
# owns takes it from the domain, where both reach it. Every top-level package but the
# domain is forbidden it, here or (`usher.eval`) by the leaf contract above, as a
# `forbidden` contract covers only what it names; `tests/unit/test_config.py` derives
# the two together. Last, since tests cite contracts by ordinal.
[[tool.importlinter.contracts]]
name = "config reads nothing above the domain"
type = "forbidden"
source_modules = ["usher.config"]
forbidden_modules = [
    "usher.ports",
    "usher.services",
    "usher.adapters",
    "usher.db",
    "usher.api",
    "usher.atomic",
    "usher.composition",
    "usher.telemetry",
    "usher.cli",
    "usher.__main__",
]
