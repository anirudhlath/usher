[project]
name = "usher"
version = "0.1.0"
description = "A self-hosted media catalog backend that abstracts media servers behind a canonical database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "uuid6>=2024.7.10",
    "loguru>=0.7",
    "httpx[http2]>=0.27",
    # The push channel's transport. Already resolved at 16.1.1 transitively
    # through `uvicorn[standard]`, and declared here anyway: a transitive
    # dependency is not a contract, and `uvicorn`'s extras are free to drop
    # it. `usher.adapters.emby.push` imports it lazily, inside the connector,
    # so a deployment that runs no push lane never pays for it.
    "websockets>=15",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "cryptography>=49.0.0",
]

[project.optional-dependencies]
# The semantic tier's model runtime, deliberately an extra rather than a
# dependency. Measured 2026-08-02: `fastembed` is 28 packages and 167 MiB
# against `sentence-transformers`' 59 and 4.8 GiB, ~4.5 GiB of which is GPU
# runtime pulled unconditionally on a host that may never have a GPU -- and
# the current `usher` image is 332 MB. Behind an extra because full-text and
# trigram serve all 1.27M titles with no model at all, so a deployment
# without this is narrowed rather than broken: `composition.embedder`
# degrades to `(None, no-op)` and the worker simply never registers
# `JobKind.INDEX`. Declared here even though the import is lazy, for the
# reason `websockets` is declared above: a lazily-imported undeclared
# dependency is a dependency nobody can install on purpose.
embedding = ["fastembed>=0.8"]

# The quality-eval harness's IR metrics. An extra for the same reason
# `embedding` is one, and measured the same two ways ADR-0022 measured that
# one. Re-measured 2026-08-18, because the figure that stood here first
# ("~30 packages", no size at all) was neither.
#
#   packages -- resolve the closure from `uv.lock`, dropping Windows-only
#   markers: `ranx` 0.3.21 is **37**, against `embedding`'s accepted 28.
#   size -- `uv pip install ranx==0.3.21` into a bare 3.13 venv, then
#   `du -sm .../site-packages`: **520 MiB**, against the 167 MiB ADR-0022
#   accepted for `fastembed`.
#
# Both numbers are checkable rather than asserted, and the method is what
# makes them so: run the same two commands against `fastembed` and they
# answer 28 packages and 175 MiB -- ADR-0022's own 28, and its 167 MiB plus
# the version drift since 2026-08-02. The `du` figure and the closure agree
# independently, the venv holding exactly 37 `.dist-info` directories.
#
# **So the argument is not that this is small. It is 3x the embedding extra,
# and since `706f207` something does pay for it every run.** That commit
# changed CI's Install step to `uv sync --frozen --extra eval`
# (`.github/workflows/ci.yml`), which falsified the sentence that stood here --
# *"CI installs with a bare `uv sync --frozen` and never passes `--extra eval`,
# so the production image and the five-step gate each pay zero"*. That
# paragraph was the whole argument for accepting this extra, so both halves are
# re-measured rather than reworded (2026-08-19, `UV_PROJECT_ENVIRONMENT`
# pointed at a venv out of tree, `du -sm .../site-packages`):
#
#   **the production image still pays zero, by construction rather than by
#   care.** `Dockerfile` syncs twice -- `uv sync --frozen --no-install-project
#   --no-dev` (l.31) and `uv sync --frozen --no-dev` (l.42) -- and neither
#   passes `--extra` anything, so `ranx` reaches neither stage; the runtime
#   stage then copies that finished venv wholesale (`COPY --from=builder ...
#   /app/.venv`, l.58) and installs nothing of its own. Note what this is *not*
#   a claim about: `COPY src/ ./src/` (l.40) copies `src/usher/eval/` into the
#   image along with everything else, so "`usher.eval` ships in no image" is
#   false. What is true is that **no shipped code path imports it** -- the
#   eleventh contract below enforces that -- and that no image installs the
#   library it would need.
#
#   **CI now pays ~26 packages and ~507 MiB per run**: `uv sync --frozen` gives
#   84 distributions / 180 MiB, `uv sync --frozen --extra eval` gives 110 / 687
#   MiB -- counting `.dist-info` directories in `site-packages`, `usher`'s own
#   editable install included on both sides so the delta is unaffected by it.
#   It is bought deliberately, for the standing rule that a run that did
#   not run is not a pass: `tests/unit/test_eval_metrics_ir.py` has to
#   *execute*, and without the extra it does not even skip -- its own
#   third-party `import ranx` errors the whole file out at collection.
#   `ci.yml`'s comment on that step carries the measured traceback and names
#   the failing line, because the mechanism is not the one an obvious repair
#   would target.
#
# **26 of the 37 are new, not 31**, and the already-present list was short by
# five. Corrected 2026-08-19, measured by normalised distribution name against
# a plain `uv sync --frozen` -- the dev environment, which is what CI and a
# developer machine both have. The **eleven** already there are `requests` with
# its four transitives (`certifi`, `charset-normalizer`, `idna`, `urllib3`),
# `packaging`, `rich` with `markdown-it-py`, `mdurl` and `pygments`, and
# `pyyaml`. The five it missed were all pre-existing rather than introduced by
# this task, but this is the number `ci.yml` now leans on, so it is the one
# that has to be right.
#
# `ranx` is confined to `usher/eval/metrics/ir.py`. `ir_measures` (4 packages)
# is the one-file swap if numba ever blocks a CPython upgrade, which is the
# named residual risk.
eval = ["ranx>=0.3.21"]

[project.scripts]
# `usher <command>` as well as `python -m usher <command>`; both land on
# `usher.cli.main`, which reads `sys.argv` when handed no argv. The
# container's CMD stays `alembic upgrade head && exec python -m usher` --
# the two are the same code path, and the module form is the one whose
# `exec`/SIGTERM behaviour has been verified against a running container.
usher = "usher.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    # import-linter's own graph engine, and already installed as its transitive
    # -- declared anyway, because `tests/unit/test_eval_contract.py` imports it
    # directly to pin the reachability fact the eleventh contract's
    # `allow_indirect_imports` rests on. An undeclared transitive is a
    # dependency nobody can install on purpose and one that a repackaging of
    # import-linter can remove without warning, which would turn a
    # gate-blocking test into a collection error.
    "grimp>=3.15",
    "testcontainers[postgres]>=4.9",
    "asgi-lifespan>=2.1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# **`packages` already ships the non-Python files inside it, and E1 Task 7
# measured that rather than assuming it.** `usher/eval/schema.sql` is read at
# runtime by `ledger.ensure_schema`, so a file that exists in the tree and not
# in the wheel is a harness that works from a checkout and fails from an
# installed copy. Built with `uv build --wheel` on 2026-08-19, the wheel's
# non-`.py` entries are exactly:
#
#     usher/db/migrations/README
#     usher/db/migrations/script.py.mako
#     usher/eval/schema.sql
#
# so hatchling's default file selection for a package directory takes every
# file in it, and the two migration files have been shipping that way since M1.
# The plan for this task called for a
# `[tool.hatch.build.targets.wheel.force-include]` entry mapping
# `src/usher/eval/schema.sql` to `usher/eval/schema.sql`; it is **not** added,
# because the measurement above says it would restate what `packages` already
# does, and a directive whose stated reason is false is the thing this
# repository keeps having to correct. What holds the claim instead is
# `tests/unit/test_eval_contract.py::test_the_schema_sql_ships_beside_the_module`,
# which resolves the path from `usher.eval.__file__` -- the installed copy --
# rather than from the repository root.
packages = ["src/usher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Applied automatically to every test under tests/integration/ by that
# directory's conftest.py (pytest_collection_modifyitems) -- not hand-applied
# per test. Registered here because --strict-markers rejects unknown markers.
# Directory placement (tests/unit vs tests/integration) is still the primary
# way Docker-dependence is organised; this marker is the secondary, explicit
# selector for tooling that would rather filter by -m than by path, e.g.
# `pytest -m "not integration"` / `pytest -m integration`. Deliberately not
# wired into addopts as a default `-m "not integration"` -- that would make
# `pytest tests/integration/...` (which Task 10's own TDD steps invoke
# directly, no `-m` override) silently collect zero tests instead of running
# them, since addopts marker expressions apply even to an explicit path.
markers = [
    "integration: needs a live PostgreSQL via Docker (testcontainers); see tests/integration/conftest.py",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# docs/ holds planning and PRD markdown with embedded Python code fences that
# other groups transcribe verbatim; ruff 0.16+ formats/lints Markdown-embedded
# code by default, so without this exclude `ruff format .` silently rewrites
# plan prose out from under whoever runs it.
#
# `.claude/` is here for the same reason and was missing until M9 measured it:
# every file under `.claude/rules/` is prose carrying code fences, and one of
# them had its fence rewritten by `ruff format --check` the first time it ran.
# The rules files are evidence — a fence reshaped to satisfy a formatter is a
# quotation that no longer matches what was measured.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests assert; not a bandit finding here.
# S105/S106/S107: M3's fixtures and fakes are built around literal
# usernames, passwords, and session tokens -- a test for "a rejected
# credential does not produce a request storm" has to name a wrong password
# somewhere -- and a `# noqa` on every one of them is noise that would
# eventually get copied into `src/`, where these rules still apply and
# still matter.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# `yaml` is here rather than as a `types-PyYAML` dev dependency: the one
# consumer is tests/unit/test_deployment_config.py, which reads compose.yml
# to check it against `Settings` and `.env.example`, and a stub package
# bought only for a test file is more surface than the `Any` it removes.
# `fastembed` ships no type information and lives behind an extra, so it
# is not installed in the environment mypy runs in -- the annotation on
# `FastEmbedEmbedder._model` is `Any` for exactly that reason, stated
# there rather than implied here.
#
# `ranx` is here for exactly `fastembed`'s reason and the entry is load-bearing
# in *both* environments: measured 2026-08-18 against a CI-identical venv
# (`UV_PROJECT_ENVIRONMENT=... uv sync --frozen`, no `--extra eval`), the two
# states raise two different error codes over the same line --
# `import-untyped` when the extra is synced and the package is installed
# without `py.typed`, `import-not-found` when it is not. So a
# `# type: ignore[import-untyped]` is green locally and **red in CI on two
# counts**, the unmatched code plus `unused-ignore` under `strict`, and
# `# type: ignore[import-not-found]` is red the other way round.
#
# **That argument was overstated until 2026-08-19 and the correction is
# narrower on two axes.** The claim was that *no* ignore comment is green in
# both; measured, a **bare** `# type: ignore` is clean in both, and ruff would
# not object either -- `PGH003` is not in `[tool.ruff.lint] select`. What is
# true is that no **code-scoped** per-line ignore can be green in both, because
# the code differs between the two environments; and that a bare ignore on
# `ir.py`'s import alone still leaves `tests/unit/test_eval_metrics_ir.py`'s own
# `import ranx` red in **both** environments (`import-untyped` installed,
# `import-not-found` absent), so the blanket form would have to be repeated at
# every import site and would silently swallow the next, unrelated error on
# each of those lines. One override entry covers both sites, is checked by
# neither environment's accident, and is the shipped choice for that reason
# rather than for the one written here before.
#
# Nothing outside `usher/eval/metrics/` may import `ranx` -- **the twelfth
# contract below** is what makes that true rather than conventional, and the
# eleventh, which this comment used to name, does not: it forbids importing
# `usher.eval`, which is a different claim about a different module. Measured,
# with the correction recorded on the twelfth contract itself.
module = ["uuid6", "testcontainers.*", "yaml", "fastembed", "ranx"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["usher"]
# Without this, `ranx` is not a node in the graph at all and the twelfth
# contract below cannot be stated -- see its comment for the measurement that
# forced it, and for what the wider graph costs. It is a top-level setting
# rather than a per-contract one, so all twelve contracts are checked against
# the wider graph; import-linter refuses to start without it when any contract
# names an external module, which is a loud failure rather than a quiet pass.
include_external_packages = true

# An allowlist, not a denylist: every top-level package's place is defined by
# where it sits (or that it's named at all), so a new package can't silently
# escape every contract the way usher.config and usher.api once did under
# three hand-maintained forbidden_modules lists.

[[tool.importlinter.contracts]]
name = "hexagonal layering"
type = "layers"
layers = ["usher.api", "usher.services", "usher.ports", "usher.domain"]

[[tool.importlinter.contracts]]
name = "adapters are driven, not driving"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports", "usher.services"]
forbidden_modules = ["usher.adapters"]

[[tool.importlinter.contracts]]
name = "db is driven, not driving"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports", "usher.services"]
forbidden_modules = ["usher.db"]

[[tool.importlinter.contracts]]
name = "config stays out of the core"
type = "forbidden"
source_modules = ["usher.domain", "usher.ports"]
forbidden_modules = ["usher.config"]

# usher.cli is the second composition root, alongside usher.api. It may import
# anything; nothing may import it. Without this contract it would sit outside
# every existing one -- exactly the "silently escape every contract" failure
# the allowlist comment above exists to prevent.
[[tool.importlinter.contracts]]
name = "cli is a composition root, nothing depends on it"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.adapters",
    "usher.db",
    "usher.api",
]
forbidden_modules = ["usher.cli"]

# The spec's "zero source-specific concepts outside adapters/emby/"
# acceptance criterion, enforced rather than asserted. With
# usher.adapters.factory now the single place in src/ that names EmbyAdapter,
# that criterion is finally expressible as a contract rather than a hope:
# without this, `api/routers/sources.py` importing EmbyAdapter directly would
# type-check, pass every test, and quietly make the abstraction decorative.
# Verified by planting exactly that import -- all five contracts above
# reported KEPT, because none of them constrains usher.api or usher.db
# against usher.adapters at all.
#
# `allow_indirect_imports` is load-bearing, not a loosening. Without it this
# contract breaks on the one import the factory exists for: usher.api.deps ->
# usher.adapters.factory -> usher.adapters.emby.adapter is an indirect chain,
# and a forbidden contract reports those by default. Verified both ways --
# with it, that chain is KEPT and a direct `from usher.adapters.emby.adapter
# import EmbyAdapter` in usher.api or usher.db is still BROKEN, which is
# exactly the line the criterion draws: nothing outside the registry may
# *name* a concrete adapter, and everything is free to reach one through the
# port.
#
# usher.cli and usher.adapters are absent from the source list deliberately:
# the former is a composition root (the contract above isolates it), and the
# latter contains the registry itself. Like every contract here this one
# enumerates its sources, so a new top-level package added later is outside
# it until someone adds it -- the same weakness the allowlist comment at the
# top of this section names, unfixable in a `forbidden` contract.
[[tool.importlinter.contracts]]
name = "no concrete source adapter escapes its package"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.api",
    "usher.db",
]
forbidden_modules = ["usher.adapters.emby"]
allow_indirect_imports = true

# The same criterion as the contract above, for the two implementations most
# likely to be swapped. Until M6 nothing stopped `usher/services/search.py`
# naming `PostgresSearchIndex` directly -- which would type-check, pass every
# test, and quietly make the port decorative. `PostgresSearchIndex` is exactly
# the class ADR-0002 says may one day be a Meilisearch class and
# `FastEmbedEmbedder` is exactly the class ADR-0022 says is one of two
# interchangeable runtimes, so the two most swap-prone implementations in the
# project were the two constrained by nothing.
#
# `allow_indirect_imports` for the previous contract's reason and not as a
# loosening: the composition root reaches these through `usher.composition`,
# and `usher.api.deps -> usher.composition -> usher.adapters.search.postgres`
# is an indirect chain a forbidden contract reports by default. Verified both
# ways -- with the flag that chain is KEPT and a direct import in
# `usher.services` is still BROKEN, which is the line the criterion draws.
#
# `usher.composition` is absent from the source list for the reason recorded
# in CLAUDE.md: it is the wiring both roots share, and the hole is closed by
# what it *imports* -- a core module reaching it breaks contracts two and
# three, which report indirect chains.
#
# Verified by planting exactly the import it forbids, in both `usher.services`
# (where contract two also fires, so it proves nothing on its own) and
# `usher.api` (which contract two does not cover, so this one fires alone).
# The last time that step was skipped, five contracts reported KEPT against a
# violation none of them constrained.
[[tool.importlinter.contracts]]
name = "no concrete search, embedding or LLM implementation escapes its package"
type = "forbidden"
source_modules = [
    "usher.domain",
    "usher.ports",
    "usher.services",
    "usher.api",
    "usher.db",
]
forbidden_modules = [
    "usher.adapters.search",
    "usher.adapters.embedding",
    # M8. `OpenAICompatibleClient` is exactly the class ADR-0027 says may one
    # day be joined by a `LiteLLMClient` -- the ADR closes with "cheap to
    # reverse", and this contract is what makes that true of the code rather
    # than only of the argument.
    "usher.adapters.llm",
]
allow_indirect_imports = true

# M8. PRD 06's *"Generation happens in a background job -- never in the request
# path"*, as a property of the import graph rather than of a name list.
#
# `tests/unit/test_api_rows.py` and `tests/unit/test_rows_curated.py` already
# scan their own module for `LLMClient`, `CurationService` and friends, and a
# name scan is the right shape there -- behaviour cannot distinguish "never
# reached an LLM" from "reached one and swallowed the failure". But a name scan
# is only ever as complete as its list, and the list had a reachable hole:
# `composition.build_curation_service` is the one public factory in `src/`
# whose entire job is to return a `CurationService` holding an `LLMClient`
# (`composition.py` calls it exactly that way when it registers the `curate`
# handler), and it is spelled with none of the forbidden words. A router doing
#
#     from usher.composition import build_curation_service
#
# was planted and passed every gate step -- ruff, mypy, all seven contracts
# above, and both suites. `api/deps.py` already imports from
# `usher.composition`, so that is the door somebody adding in-request
# generation reaches for, not a hypothetical one. The same hole swallows a
# rename: the scan catches `CurationServiceDep` only because the string
# `CurationService` is inside it, and `CuratorDep` would be silent.
#
# `usher.composition` is deliberately absent from every contract above (see the
# comment on the previous one), so nothing constrained this at all. Naming it
# here closes that for the one package where an in-request completion would
# actually be bought.
#
# `allow_indirect_imports` is load-bearing for the reason it is on the two
# contracts above, and this contract does not hold without it: every router
# imports `usher.api.deps`, which is the API's composition root and imports
# `usher.composition` on purpose, so `usher.api.routers.health ->
# usher.api.deps -> usher.composition` is an indirect chain a forbidden
# contract reports by default. Measured: without the flag this contract is
# BROKEN at HEAD on three chains through `api/deps.py` and `api/lanes.py`,
# which is the reverse of what it is for. With it, the line drawn is the one
# that matters -- a router may reach a service through a dependency, and may
# not *name* the wiring, the curation service or the LLM port itself.
#
# Verified in both directions: KEPT at HEAD, and BROKEN on each of the three
# forbidden modules planted directly (`usher.composition` in
# `routers/rows.py`; `usher.services.curation` and `usher.ports.llm` in
# `routers/home.py`, which no name scan in the suite covers at all).
[[tool.importlinter.contracts]]
name = "no router names the wiring, the curation service or the LLM port"
type = "forbidden"
source_modules = ["usher.api.routers"]
forbidden_modules = [
    "usher.composition",
    "usher.services.curation",
    "usher.ports.llm",
]
allow_indirect_imports = true

# **`adapters/http.py` is now shared by four adapter packages, and nothing kept
# it a leaf.** Until 2026-08-10 it held one function (`retry_after_seconds`) and
# its module docstring's claim to be the home for "HTTP helpers shared by every
# adapter that talks to an upstream over httpx... instead of each reimplementing
# it" was mostly aspiration -- `decode_json`, the untranslated-failure tuple and
# the status-code ladder were each written two or three times, once per adapter.
# That review consolidated them here, so this module now owns the **error
# taxonomy translation for the whole project**: `bulk`, `emby`, `llm` and `tmdb`
# all import it, and `ADR-0027`'s "the error taxonomy is ours" is a property of
# this one file.
#
# Which makes the direction of the edge load-bearing for the first time. A
# shared module that imports one of its own consumers is a cycle, and the
# failure is quiet rather than loud: the import resolves, the tests pass, and
# the next adapter to need a helper finds a "shared" module that drags an Emby
# session or an httpx-mocked TMDb client in behind it. The generalisation
# argument is the one the previous contract records -- *prefer a graph property
# wherever one is expressible* -- and the alternative here is a convention in a
# docstring, which is what the three duplicate copies grew out of.
#
# **No `allow_indirect_imports`, deliberately, and it is the opposite call from
# the three contracts above.** They carry the flag because their sources
# legitimately reach the forbidden module through a composition root. This one
# has no such path: `usher.adapters.http` imports `httpx` and the standard
# library and nothing else in this project, so an *indirect* chain into an
# adapter is exactly as much a cycle as a direct one and there is no honest
# reason for either.
#
# Verified in both directions rather than asserted: KEPT at HEAD (9 kept, 0
# broken), and BROKEN on a plant -- `from usher.adapters.emby.session import
# EmbySession` added to `adapters/http.py` **in its isort position**, so the
# careful spelling of the defect is what was measured and not the careless one
# `ruff check` would have caught first.
[[tool.importlinter.contracts]]
name = "the shared http helpers import no concrete adapter"
type = "forbidden"
source_modules = ["usher.adapters.http"]
#
# **`usher.adapters.images` joined this list in M9 and the list is the whole
# contract**, which is why adding a package here is not bookkeeping: this is a
# `forbidden` contract, so a seventh adapter package left out is a package the
# contract silently stops covering — the gate still reports 9 kept, 0 broken
# and the newest adapter is the one thing nothing constrains. The image fetcher
# is a fifth consumer of `adapters/http.py` (it takes `UNTRANSLATED_FAILURES`
# and `port_error_for`), so it is exactly the shape this edge exists for.
#
# It deliberately does **not** join the contract above. That one's name is
# about search, embedding and LLM implementations — the two classes ADR-0002
# and ADR-0022 name as swappable and the one ADR-0027 does — and adding an
# image adapter to it would make the name false. Contract 2 (*adapters are
# driven, not driving*) covers the new package for free. So M9 adds a
# forbidden module, not a tenth contract.
forbidden_modules = [
