services:
  usher:
    build: .
    restart: unless-stopped
    # `env_file:` hands the container the whole `.env`; an `environment:` list
    # forwards only the keys somebody remembered, and a setting that never arrives
    # is dead config that looks like a control. `required: false`, so a checkout
    # with no `.env` fails on USHER_SECRET_KEY's guard instead of a missing file.
    env_file:
      - path: .env
        required: false
    environment:
      # Only what the compose topology owns: these win over `env_file:`, so an
      # operator cannot change them from `.env`. Each says why.
      #
      # The database's hostname on the compose network, not `localhost`.
      USHER_DATABASE_URL: postgresql+asyncpg://usher:usher@postgres:5432/usher
      # Bind-all, or the published port below reaches nothing.
      USHER_HOST: 0.0.0.0
      # What `ports:`, the Dockerfile's EXPOSE and the healthcheck assume. The host
      # side is USHER_COMPOSE_HOST_PORT.
      USHER_PORT: "8000"
      # Substituted for the `:?` guard, so a blank key fails `docker compose up`
      # with this sentence rather than in the container's log.
      USHER_SECRET_KEY: ${USHER_SECRET_KEY:?set USHER_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      # The container side of the two bind mounts below. `.env`'s relative paths
      # would resolve under /app, which is root-owned, so uid 1000 cannot create them.
      USHER_IMAGE_CACHE_DIR: /data/images
      USHER_BULK_DATA_DIR: /data/bulk
      # Not HF_HUB_OFFLINE: `environment:` beats `env_file:`, so setting it here
      # would make USHER_EMBEDDING_OFFLINE=false, the documented way to warm a
      # model cache, dead config inside the container.
    ports:
      # USHER_COMPOSE_HOST_PORT, not a bare "8000:8000", so a host already using
      # 8000 needs no edit. `Settings` drops USHER_COMPOSE_* before validating:
      # pydantic-settings reads the same `.env` and refuses unknown USHER_* keys.
      - "${USHER_COMPOSE_HOST_PORT:-8100}:8000"
    volumes:
      # Docker creates a missing bind-mount source as root, and the host side's
      # ownership wins over the Dockerfile's `chown` once mounted, so uid 1000
      # cannot write. A fresh checkout needs, once:
      #   mkdir -p data/images data/bulk && sudo chown 1000:1000 data/images data/bulk
      # Bind mounts, not named volumes, so an operator can see and delete them.
      - ./data/images:/data/images
      # So downloaded dumps survive `docker compose up --build`, and a dev shell
      # and the container share one download.
      - ./data/bulk:/data/bulk
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health/ready, not /health, so "healthy" means it can serve. Plain compose
      # never restarts a container for a failed healthcheck, so this cannot
      # restart-loop. python:3.13-slim has no curl or wget; urlopen raises on non-2xx.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: usher
      POSTGRES_PASSWORD: usher
      POSTGRES_DB: usher
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP, and is load-bearing. On a fresh volume initdb runs
      # a temporary socket-only server, which a socket pg_isready reports as
      # accepting; `service_healthy` gates on that first success and would start
      # `usher` against a server about to restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U usher -d usher"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  # Pinned, so the name is a contract rather than a function of this directory's
  # name, which a rename or a worktree would move. Anything joining the stack joins
  # by it; renaming it is a silent breaking change. A second stack on the same host
  # sets USHER_COMPOSE_NETWORK *and* its own COMPOSE_PROJECT_NAME: a shared name
  # puts two `postgres` aliases on one network, a shared project recreates the
  # first stack's containers.
  #
  # No external network here: `external: true` fails `up` on any host that lacks
  # it. The telemetry stack's network is joined by compose.observability.yml.
  default:
    name: ${USHER_COMPOSE_NETWORK:-usher_default}
