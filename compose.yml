services:
  usher:
    build: .
    restart: unless-stopped
    # `env_file:`, not a hand-maintained `environment:` list -- and the two
    # are different mechanisms rather than two spellings of one. An
    # `environment:` entry names one variable and compose substitutes its
    # value from `.env`; `env_file:` hands the whole file to the container.
    #
    # This started as the second form and forwarded five of the thirty
    # documented keys, so the other 24 -- twelve of them M5's own, including
    # USHER_WORKER_ENABLED -- were documented in `.env.example` and README.md
    # and reached nothing. A setting an operator can set and the container
    # never sees is dead config that looks like a control, and this one has
    # teeth: an operator who sets USHER_WORKER_ENABLED=false and then runs
    # `usher work` in a second container gets two workers, and
    # `JobWorker.startup()` requeues everything `running`, so each steals the
    # other's live claims.
    #
    # `required: false` so a checkout with no `.env` yet still parses, and
    # fails on USHER_SECRET_KEY below with a sentence instead of on a missing
    # file. `tests/unit/test_deployment_config.py` pins both this and the
    # `environment:` list below.
    env_file:
      - path: .env
        required: false
    environment:
      # Only what the compose *topology* owns. `environment:` wins over
      # `env_file:`, so every line here is a setting an operator cannot
      # change from `.env` -- which is why there are four of them and each
      # says why.
      #
      # The service's hostname on the compose network. `.env` ships
      # `localhost`, which is right for a dev shell and for `alembic`, and
      # wrong inside the container.
      USHER_DATABASE_URL: postgresql+asyncpg://usher:usher@postgres:5432/usher
      # Bind-all, or the published port below reaches nothing.
      USHER_HOST: 0.0.0.0
      # Settings.port's own default (src/usher/config.py), and what the
      # `ports:` mapping, the Dockerfile's EXPOSE and the healthcheck below
      # all assume. The knob an operator actually wants is the *host* side,
      # which is USHER_COMPOSE_HOST_PORT.
      USHER_PORT: "8000"
      # Substituted rather than inherited from `env_file:` purely for the
      # `:?` guard: a missing or blank key fails at `docker compose up` with
      # this sentence, instead of as a container that starts and dies on a
      # validation error the operator has to go and read the logs for.
      USHER_SECRET_KEY: ${USHER_SECRET_KEY:?set USHER_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      # The image cache, and the fifth entry this list has ever had. A
      # bind-mount path is a topology fact in exactly the way the four above
      # are: `volumes:` below mounts the host's ./data/images at
      # /data/images, and `.env`'s `data/images` is right for a dev shell and
      # wrong inside a container whose WORKDIR is /app -- there it would put
      # the cache in the image's own writable layer, where it survives no
      # `docker compose up --build` and appears in no `du` an operator runs
      # against the mount. The other three USHER_IMAGE_* settings are the
      # operator's and are deliberately absent from this block.
      USHER_IMAGE_CACHE_DIR: /data/images
      # **`HF_HUB_OFFLINE` is deliberately not a fifth entry**, though M6's
      # plan asked for one as a topology fact. `environment:` beats
      # `env_file:` absolutely, and `usher.composition.embedder` reaches the
      # library through `os.environ.setdefault` -- so hard-setting it here
      # would make `USHER_EMBEDDING_OFFLINE=false`, the documented way to
      # warm a model cache once, dead config inside the container. That is
      # the exact shape `USHER_COMPOSE_` exists to prevent, one layer over.
      # The setting covers every entry point instead, including the ones
      # compose cannot reach at all (`uv run usher work`, a dev shell), and
      # this image installs no embedding extra and ships no model cache, so
      # the variable would be inert here regardless.
    ports:
      # Host-side port is overridable (USHER_COMPOSE_HOST_PORT in .env)
      # rather than a bare "8000:8000" -- this host already has another
      # container publishing 8000, and a hardcoded collision is exactly the
      # kind of thing an override exists to avoid. `USHER_COMPOSE_` is the
      # namespace `Settings` deliberately ignores (src/usher/config.py):
      # `.env` is read both by compose and by pydantic-settings, and this
      # variable is meaningful only to the first. Named `USHER_HOST_PORT`
      # until M5, which made `cp .env.example .env` -- the README's own
      # first step -- fail every entry point with `extra_forbidden`.
      - "${USHER_COMPOSE_HOST_PORT:-8100}:8000"
    volumes:
      # The image proxy's cache (PRD 07's GET /images/{id}, M9). Bind-mounted
      # rather than a named volume so an operator can see it, measure it and
      # delete it -- there is no eviction and none is wanted: the ladder
      # bounds the cache at four entries an image and reclaiming space costs a
      # re-fetch (ADR-0032). **Docker creates the host directory as root if it
      # does not exist**, and the container runs as uid 1000, so a first
      # `docker compose up` on a fresh checkout needs
      # `mkdir -p data/images && sudo chown 1000:1000 data/images` -- the
      # Dockerfile's `chown` reaches the image's own /data and a bind mount's
      # host-side ownership wins once mounted. README.md carries the line.
      - ./data/images:/data/images
    networks:
      # Two networks, and the second is why this key exists at all. `default`
      # is what compose would have given implicitly -- it has to be named
      # once anything else is. `observability` is the external stack at
      # ~/code/observability, and joining it is the only route to the OTel
      # collector: that stack publishes every port on 127.0.0.1 deliberately
      # (this box is internet-facing), so there is no host-side address a
      # container can reach 4317 on. `usher-postgres-1` is already joined to
      # it for Grafana's datasource, by the same reasoning.
      #
      # `OTEL_EXPORTER_OTLP_ENDPOINT` in `.env` is the reader. It stays in
      # `.env` rather than the `environment:` block below because the
      # endpoint is an operator's choice -- a deployment with no collector
      # leaves it empty and the exporter is never built.
      - default
      - observability
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health/ready, not /health: for `depends_on: condition:
      # service_healthy` and `docker compose ps` to mean anything useful,
      # "healthy" has to mean "can actually serve a request", which is
      # what readiness (database + migration state) reports and liveness
      # deliberately does not. This does not carry the restart-loop risk
      # a Kubernetes liveness probe would: plain `docker compose` (no
      # Swarm) never restarts a container because its healthcheck failed
      # -- it only ever restarts on the container *process* exiting, which
      # `restart: unless-stopped` governs independently. An "unhealthy"
      # status here is purely informational plus a startup-order gate for
      # any future service that depends on usher, not a trigger for
      # anything to kill and restart this one -- so a Postgres blip
      # degrading readiness cannot start a restart loop the way it could
      # under a liveness-probe-driven orchestrator.
      #
      # No curl/wget in python:3.13-slim (and adding either would cut
      # against keeping the image small), so this shells out to the
      # interpreter that's already there: urlopen raises on any non-2xx
      # status or connection failure, which is already a nonzero exit --
      # no explicit try/except needed for a healthcheck, where any
      # exception already means "unhealthy".
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: usher
      POSTGRES_PASSWORD: usher
      POSTGRES_DB: usher
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP connection instead of pg_isready's
      # default Unix-socket lookup -- load-bearing, not cosmetic. On a
      # fresh (empty) volume this image's entrypoint runs initdb, then
      # brings up a *temporary* bootstrap server to run init scripts
      # before starting the real one -- and that bootstrap server is
      # started with listen_addresses='' (Unix socket only, verified
      # against the image's own entrypoint script), while the real server
      # listens on TCP. Verified directly against this exact image on
      # this host: plain `pg_isready -U usher -d usher` (Unix socket)
      # reports "accepting connections" at t+1.8s -- the bootstrap
      # server -- then "rejecting connections" from t+2.0s to t+2.9s
      # while it shuts down and the real one starts, before settling
      # "accepting" again at t+3.0s. `-h 127.0.0.1` never once
      # false-positives in the same run: "no response" solidly until
      # t+2.9s, the same moment the real server actually starts
      # accepting TCP connections. Without -h, `depends_on: condition:
      # service_healthy` can let `usher` start against a server that is
      # about to be torn down and restarted.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U usher -d usher"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  # Named so `usher-web`'s compose (~/code/usher-web) can join it as an
  # external network and reach this service at `usher:8000`. Without the
  # explicit name compose would call it `usher_default`, which is what it
  # is called today -- pinning it here makes that a contract rather than a
  # consequence of the directory name.
  default:
    name: usher_default
  # The shared telemetry stack, created by ~/code/observability. `external`
  # because this compose project must not own its lifecycle: a
  # `docker compose down` here would otherwise try to remove a network
  # Grafana, Prometheus, Loki, Tempo and the collector are all on.
  observability:
    external: true
